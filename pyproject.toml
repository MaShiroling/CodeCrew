[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codecrew-ai"
version = "0.1.0"
description = "Heterogeneous coding-agent orchestration and reliability evaluation platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CodeCrew contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "jsonschema>=4.25,<5",
]

[project.scripts]
codecrew = "app.cli:main"

[project.optional-dependencies]
feishu = ["lark-oapi==1.7.3"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: opt-in tests that invoke installed agent CLIs and may use network/token quota",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["UP017"] # Keep fallback checks runnable on the host's Python 3.9.
